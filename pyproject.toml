[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-tool-call-validator"
version = "0.1.0"
description = "A small, provider-neutral JSON Schema validation exercise for LLM tool calls"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
validate-tool-call = "tool_call_validator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
